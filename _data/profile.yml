short_bio: >-
  <p>
    I am a physics educator and researcher in <b>computational condensed matter physics</b>.
    I received my PhD in Physics from the Pakistan Institute of Engineering and Applied Sciences (PIEAS), Islamabad,
    with a thesis on <i>First Principles Calculations of Zirconium Based MXene Interfaces</i>.
    I have taught undergraduate to graduate-level physics since 2009.
  </p>
  <p>
    My research combines first-principles computational physics with materials modelling, with emphasis on
    DFT and TDDFT dynamical studies of 2D materials, MXenes, perovskites, bulk and functional materials.
  </p>
  <p class="mb-1"><b>Research interests</b></p>
  <ul>
    <li>DFT and TDDFT studies of 2D materials and MXenes</li>
    <li>Linear and nonlinear optics (second-harmonic generation)</li>
    <li>Perovskites and photovoltaic materials</li>
    <li>Thermoelectric and infrared-responsive materials</li>
  </ul>

